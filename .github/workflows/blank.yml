
name: RaceDay CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.API/RaceDay.API.sln

      - name: Build solution
        run: dotnet build RaceDay.API/RaceDay.API.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.API/RaceDay.API.sln --configuration Release --no-build
